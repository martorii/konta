[project]
name = "konta"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "martorii", email = "erik.martori@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
konta = "konta:main"

[build-system]
requires = ["uv_build>=0.8.4,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.14",
    "pytest>=8.3",
    "ruff>=0.9",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.13"
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
